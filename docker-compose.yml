services:
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: ai-task-risk-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317" # OTLP gRPC receiver
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:14269/"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-task-risk-backend
    environment:
      # Send traces to Jaeger via OTLP gRPC.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    ports:
      - "8000:8000" # FastAPI API + frontend UI
    depends_on:
      jaeger:
        condition: service_healthy
